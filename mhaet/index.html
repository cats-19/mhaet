<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3ecdf" />
    <title>Aurelia — Gentle care for every stage of motherhood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("aurelia-theme-v1");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#15120e");
          } else {
            document.documentElement.dataset.theme = "light";
          }
          var lang = localStorage.getItem("aurelia-language-v1");
          if (lang === "am" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
